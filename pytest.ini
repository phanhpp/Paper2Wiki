[pytest]
asyncio_mode = auto
markers =
    slow: tests that take a long time
    smoke: quick sanity checks
    integration: tests that need external services
    unit: isolated unit tests
    expect_exception: tests that expect an exception

# Set default test paths
testpaths = tests

# Ignore certain directories
norecursedirs = .git .venv 
# Ignore deprecation warnings from langsmith
filterwarnings =
      ignore::DeprecationWarning:langsmith