# LiteLLM gateway — single container, only manage one single service: the LiteLLM Proxy 
# EXTERNAL managed data stores (production-shaped).
#   DB:    managed Postgres (Neon / RDS)        → DATABASE_URL in .env
#   Cache: managed Redis Stack (Redis Cloud)    → REDIS_* in .env   (needs the Search/vector
#          module for Step-4 semantic cache — plain Redis won't work)
#
# Run from this directory:  cp .env.example .env  (fill URLs/keys)  &&  docker compose up -d

services:
  litellm:
    image: ghcr.io/berriai/litellm-database:main-latest
    ports:
      - "4000:4000" # send requests from local terminal to http://localhost:4000, get forwarded to container port 4000
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./cache_logger.py:/app/cache_logger.py   # custom callback: concise cache HIT/miss logs
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0  # Safe, stable production version
    container_name: prometheus-metrics
    ports:
      - "9090:9090"  # 👈 This lets you view the raw Prometheus charts on your laptop
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/master_key:/etc/prometheus/master_key:ro
      - prometheus_data:/prometheus  # Keeps your metric history safe if the container restarts
    restart: unless-stopped

volumes:
  prometheus_data: #Tell Docker to set aside a dedicated folder on your hard drive for Prometheus's database files.