[project]
name = "any2wiki"
version = "0.1.0"
description = "Any2Wiki Deep Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "arxiv>=2.0.0",
    "deepagents>=0.5.3",
    "docling>=2.90.0",
    "exa-py>=2.13.0",
    "firecrawl-py>=4.28.2",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "langchain-daytona>=0.0.5",
    "langchain[anthropic,openai]>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith[vcr]>=0.7.32",
    "prompt-toolkit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "rich>=13.0.0",
    "slack-bolt>=1.21.0",
    "tavily-python>=0.7.25",
    "typer>=0.12.0",
]

[project.scripts]
any2wiki = "src.cli.app:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["src*"]
