name: CI

on:
  pull_request:
    # Only run when code or eval cases actually change — skip for README/doc-only edits.
    paths:
      - 'src/**'
      - 'skills/**'
      - 'eval/**'
      - 'tests/**'          # a test-only PR must still run the tests it changes
      - 'pyproject.toml'    # a dependency bump changes what everything runs against
      - 'uv.lock'
  push:
    branches: [main]
    paths:
    - 'src/**'
    - 'skills/**'
    - 'eval/**'
    - 'tests/**'
    - 'pyproject.toml'
    - 'uv.lock'
    # Github doesn't allow both paths and paths-ignore 
  # schedule:
  #   - cron: "0 2 * * 1"   # weekly on Monday at 02:00 UTC — uncomment when ready
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Eval dataset to run (leave blank for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - ingest
          - query
          - marp

permissions:
  contents: read
  pull-requests: write   # needed so the eval gate can post a PR comment

# One run per branch. Pushing three commits to a PR used to start three full runs and
# leave the earlier two going; now the older ones are cancelled. Never cancel a run on
# main — that one is the record of what actually shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-and-eval:
    name: Unit Tests & Eval Gate
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.dataset == ''
    # Single job = one checkout + one uv sync. Unit tests run first;
    # eval gate only runs on PRs/push (not weekly schedule).
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen

      - name: Unit tests
        run: uv run pytest -m "not integration and not slow" -q

      - name: Eval gate
        # Skip on weekly schedule, only works on PRs not direct push to main
        if: github.event_name == 'pull_request'
        # Calls tools directly (no agent), fast. Map all web-provider keys; run_gate uses whichever
        # is set (FIRECRAWL/TAVILY/EXA) so the web-tool cases run on same-repo PRs. On fork PRs
        # GitHub withholds secrets → those cases skip gracefully (they're `capability`,
        # non-blocking). See eval/run_gate.py:_HAS_WEB_PROVIDER.
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: uv run python eval/run_gate.py # if exits non-zero, the job fails → red check → merge blocked

      - name: Post eval results to PR
        # this just compliment the PR gate by reading results.json
        # and writes a human-readable summary as a PR comment (pass/fail emoji, scores, failures)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('eval/results.json')) return;
            const r = JSON.parse(fs.readFileSync('eval/results.json', 'utf8'));
            const emoji = r.gate_passed ? '🟢' : '🔴';
            const skippedNote = r.skipped > 0 ? `\n_(${r.skipped} case(s) skipped — no web provider key)_` : '';
            const lines = [
              `## ${emoji} Eval Gate — ${r.passed}/${r.total} passed (${(r.overall*100).toFixed(0)}%)${skippedNote}`,
              r.regression_detected ? '⚠️ **Regression detected vs baseline**' : '',
              r.gate_failures.length
                ? '### Gate failures\n' + r.gate_failures.map(f => `- ${f}`).join('\n')
                : '',
              r.case_failures.length
                ? '### Case failures\n' + r.case_failures.map(f => `- \`${f}\``).join('\n')
                : '',
              Object.keys(r.capability_scores).length
                ? '### Capability scores (tracked, not gate-blocking)\n' +
                  Object.entries(r.capability_scores).map(([k,v]) => `- ${k}: ${(v*100).toFixed(0)}%`).join('\n')
                : '',
            ].filter(Boolean).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines,
            });

  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # Not on push: a merge to main would re-run the golden evals the PR already ran,
    # and those cost real LLM calls (the cheap `Eval gate` step is already PR-only).
    if: >
      github.event_name != 'schedule' && github.event_name != 'push' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.dataset == '')
    outputs:
      ingest: ${{ steps.filter.outputs.ingest_any_changed }}
      query:  ${{ steps.filter.outputs.query_any_changed }}
      marp:   ${{ steps.filter.outputs.marp_any_changed }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: tj-actions/changed-files@v46
        id: filter
        with:
          files_yaml: |
            ingest:
              - skills/llm-wiki/**
              - src/tools/arxiv_tool.py
              - src/tools/docling_parser.py
              - src/tools/wiki_integrity_check.py
              - src/tools/web_tools/**
              - src/tools/ingest_tools.py
              - src/agents/agent.py
              - eval/golden_datasets/ingest.json
            query:
              - skills/llm-wiki/**
              - src/agents/agent.py
              - eval/golden_datasets/query.json
            marp:
              - skills/marp-slide/**
              - src/agents/daytona_agent.py
              - eval/golden_datasets/marp.json

  eval-ingest:
    name: Eval — Ingest golden
    needs: [detect-changes]
    if: >
      !cancelled() &&
      (needs.detect-changes.outputs.ingest == 'true' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.dataset == '' || github.event.inputs.dataset == 'ingest')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGSMITH_TRACING: "true"
      # Pin to fast mode — uses web_search/web_extract, no arXiv/Docling dependency.
      # At least one web provider key required; registry picks first available.
      ANY2WIKI_INGEST_MODE: fast
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, python-version: "3.11" }
      - run: uv sync --frozen
      - name: Push ingest dataset
        run: uv run python eval/push_golden_datasets.py --dataset ingest
      - name: Run ingest eval
        timeout-minutes: 15
        run: uv run python eval/run_weekly_eval.py --dataset ingest --use-cached-all --filter-type already-ingested

  eval-query:
    name: Eval — Query golden
    needs: [detect-changes]
    if: >
      !cancelled() &&
      (needs.detect-changes.outputs.query == 'true' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.dataset == '' || github.event.inputs.dataset == 'query')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGSMITH_TRACING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, python-version: "3.11" }
      - run: uv sync --frozen
      - name: Push query dataset
        run: uv run python eval/push_golden_datasets.py --dataset query
      - name: Run query eval
        timeout-minutes: 8
        run: uv run python eval/run_weekly_eval.py --dataset query --use-cached-all

  eval-marp:
    name: Eval — Marp golden
    needs: [detect-changes]
    if: >
      !cancelled() &&
      (needs.detect-changes.outputs.marp == 'true' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.dataset == '' || github.event.inputs.dataset == 'marp')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      LANGSMITH_TRACING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, python-version: "3.11" }
      - run: uv sync --frozen
      - name: Push marp dataset
        run: uv run python eval/push_golden_datasets.py --dataset marp
      - name: Run marp eval
        timeout-minutes: 8
        run: uv run python eval/run_weekly_eval.py --dataset marp --use-cached-all

  weekly:
    name: Weekly (anomaly baselines)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit refreshed memories/baselines.json back to main
    # Only runs on schedule — not on PRs or push to main.
    # One job: refresh memories/baselines.json (rolling latency/token/step medians) from
    # recent traces, and commit it, so local detect_anomalies_async compares against
    # CI-fresh thresholds.
    #
    # There is deliberately no replay step here. A hard error becomes durable coverage by
    # being promoted into eval/pr_gate_cases.json, which runs on EVERY PR — replaying the
    # same examples weekly duplicated that. See eval/README.md.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dataset == '')
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen

      - name: Update anomaly baselines
        # Fetches recent traces and merges rolling medians into memories/baselines.json.
        # Local detect_anomalies_async reads this file — git pull before trace analysis.
        run: uv run python eval/run_weekly_baselines.py

      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memories/baselines.json
          if git diff --staged --quiet; then
            echo "No baseline changes — skipping commit"
          else
            git commit -m "chore: refresh anomaly baselines from weekly CI"
            git push
          fi

