name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - run: uv sync --frozen

      - run: uv run pytest -m "not integration and not slow and not langsmith" -q

  regression:
    name: Regression (LangSmith)
    runs-on: ubuntu-latest
    needs: unit

    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGSMITH_TEST_SUITE: "paper2wiki-regression"
      LANGSMITH_EXPERIMENT: ${{ github.sha }}
      LANGSMITH_TEST_CACHE: tests/cassettes
      LANGSMITH_EXPERIMENT_METADATA: >
        {"git_sha": "${{ github.sha }}", "branch": "${{ github.ref_name }}"}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - run: uv sync --frozen

      - name: Run regression suite
        run: uv run pytest -m "langsmith and not slow" -q
