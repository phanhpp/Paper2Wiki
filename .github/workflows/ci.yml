name: CI

on:
  pull_request:
    # Only run when code or eval cases actually change — skip for README/doc-only edits.
    paths:
      - 'src/**'
      - 'skills/**'
      - 'eval/**'
      - 'CLAUDE.md'
      - 'config.example.yaml'
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC — runs the langsmith regression job

permissions:
  contents: read
  pull-requests: write   # needed so the eval gate can post a PR comment

jobs:
  unit-and-eval:
    name: Unit Tests & Eval Gate
    runs-on: ubuntu-latest
    # Single job = one checkout + one uv sync. Unit tests run first;
    # eval gate only runs on PRs/push (not nightly schedule).
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen

      - name: Unit tests
        run: uv run pytest -m "not integration and not slow and not langsmith" -q

      - name: Eval gate
        # Skip on nightly schedule — this is a PR gate, not a nightly check.
        if: github.event_name != 'schedule'
        # Calls tools directly (no agent). Cases needing web provider API keys
        # are silently skipped when no key is set — see eval/run_gate.py.
        run: uv run python eval/run_gate.py

      - name: Post eval results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('eval/results.json')) return;
            const r = JSON.parse(fs.readFileSync('eval/results.json', 'utf8'));
            const emoji = r.gate_passed ? '🟢' : '🔴';
            const skippedNote = r.skipped > 0 ? `\n_(${r.skipped} case(s) skipped — no web provider key)_` : '';
            const lines = [
              `## ${emoji} Eval Gate — ${r.passed}/${r.total} passed (${(r.overall*100).toFixed(0)}%)${skippedNote}`,
              r.regression_detected ? '⚠️ **Regression detected vs baseline**' : '',
              r.gate_failures.length
                ? '### Gate failures\n' + r.gate_failures.map(f => `- ${f}`).join('\n')
                : '',
              r.case_failures.length
                ? '### Case failures\n' + r.case_failures.map(f => `- \`${f}\``).join('\n')
                : '',
              Object.keys(r.capability_scores).length
                ? '### Capability scores (tracked, not gate-blocking)\n' +
                  Object.entries(r.capability_scores).map(([k,v]) => `- ${k}: ${(v*100).toFixed(0)}%`).join('\n')
                : '',
            ].filter(Boolean).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines,
            });

  nightly:
    name: Nightly (LangSmith regression)
    runs-on: ubuntu-latest
    # Only runs on schedule — not on PRs or push to main.
    # Fetches live traces, runs anomaly regression against LangSmith datasets.
    if: github.event_name == 'schedule'
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_TEST_SUITE: "paper2wiki-regression"
      LANGSMITH_EXPERIMENT: ${{ github.sha }}
      LANGSMITH_TEST_CACHE: tests/cassettes
      LANGSMITH_EXPERIMENT_METADATA: >
        {"git_sha": "${{ github.sha }}", "branch": "${{ github.ref_name }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Run LangSmith anomaly regression
        run: uv run pytest -m "langsmith and not slow and not integration" -q
