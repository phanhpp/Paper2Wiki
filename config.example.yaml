# Paper2Wiki configuration
# Place at: ~/.paper2wiki/config.yaml
# Or set PAPER2WIKI_CONFIG=/path/to/config.yaml

# ── LLMs ──────────────────────────────────────────────────────────────────────
# Pick ONE base model (and set that provider's API key). It drives the supervisor,
# the subagents, and every auxiliary task. Any single task can override it below.
#
# A model accepts any LangChain value, including the `provider:model` form:
#   openai:gpt-4o · anthropic:claude-sonnet-4-6 · google_genai:gemini-2.0-flash
#   groq:llama-3.3-70b-versatile · mistral:mistral-large-latest · ollama:llama3.1
# The key is read from the provider's env var (OPENAI_API_KEY / ANTHROPIC_API_KEY /
# GOOGLE_API_KEY / …) unless you set `api_key` explicitly below.
#
# Env overrides (no config file needed):
#   PAPER2WIKI_MODEL=openai:gpt-4o              # base model for everything
#   PAPER2WIKI_MODEL_SUBAGENT=openai:gpt-4o-mini  # one task only
model:
  default: claude-sonnet-4-6   # the user's chosen LLM (omit → falls back to Claude)
  provider: anthropic          # 'auto' or omit to infer from the model name
  # base_url:                  # custom/OpenAI-compatible endpoint (else provider default)
  # api_key:                   # else read from the provider's env var

# Per-task overrides. Every task inherits `model` above unless you set fields here.
# All fields optional: provider ('auto'=infer), model (''=inherit base), base_url,
# api_key, timeout (seconds), extra_body (provider-specific kwargs).
# Tasks: supervisor · subagent (marp) · title · summarize (traces) · judge (eval) ·
#        web_summarize (web-page compression — was web.summarizer_model).
auxiliary:
  # Example: keep the cheap auxiliary tasks on Haiku while the base is something else.
  # web_summarize:
  #   provider: anthropic
  #   model: claude-haiku-4-5-20251001
  #   timeout: 120
  #   extra_body: {}
  #
  # Example: route one task through OpenRouter (an OpenAI-compatible gateway).
  # Use provider: openai + base_url — NOT provider: openrouter (that needs the
  # extra `langchain-openrouter` package). Pick a tool-calling-capable model.
  # summarize:
  #   provider: openai
  #   model: google/gemini-2.5-flash
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: sk-or-...
  #   timeout: 60
  #   extra_body: {}          # OpenRouter-specific params (provider routing, etc.)

web:
  # Shared default provider — used when no per-capability override is set.
  # Options: firecrawl, tavily, exa
  # If omitted, priority walk picks the first provider with valid credentials.
  backend: firecrawl

  # Per-capability overrides — use different providers for search vs extract.
  # Uncomment to override the shared backend for a specific capability.
  # search_backend: tavily
  # extract_backend: firecrawl

  # Pages shorter than this (in chars) skip LLM summarization.
  # (The summarizer's MODEL is configured under `auxiliary.web_summarize` above.)
  # Raw content is returned as-is. Default: 5000
  min_length_for_summary: 5000

ingest:
  # Parsing strategy for research papers and PDFs.
  # Web tools (web_search/web_extract) are always available for articles and generic URLs.
  # "quality" = add fetch_arxiv + parse_pdf_docling for high-fidelity arXiv/PDF parsing
  # "fast"    = web tools only; no arXiv/Docling dependency
  # Default: fast
  # Override without a config file: PAPER2WIKI_INGEST_MODE=fast (env var takes priority)
  # Note: explicit user instructions in the prompt override this setting.
  mode: fast

# ── Loop 2: in-run verification ───────────────────────────────────────────────
# After each run the WikiRubricMiddleware classifies what the agent did (ingest /
# query / marp), checks it, and on failure sends it back to the model with the
# specific gaps. No LLM call — every check is deterministic or a similarity
# score. LLM-as-judge grading stays in eval/run_weekly_eval.py.
verification:
  enabled: true            # kill switch: false makes the middleware inert
  max_iterations: 2        # retries before giving up and surfacing the failure

  # Query-path semantic checks (not yet implemented — see docs/loop_engineer/).
  # Both thresholds are biased toward PASSING: a verification loop that cries
  # wolf on normal usage gets switched off, and then you have nothing.
  embedding_model: text-embedding-3-small
  thresholds:
    page_relevance: 0.40   # J1 — are the pages read relevant? err LOW
    index_coverage: 0.60   # J2 — does the wiki cover this question? err HIGH

# ── Connectors: phase 1 of ingest, deterministic and LLM-free ────────────────
# `paper2wiki fetch <name>` hits a source, dumps the raw response under
# connectors/<name>/raw/, and records each item in manifest.json. Nothing is
# written to the wiki here — synthesis is a separate agent run, which can be
# repeated for free because the raw data is already local.
connectors:
  git-repo:
    enabled: false           # set true and list repos below
    repos: []
      # - id: any2wiki
      #   path: ~/dev/llm_wiki
